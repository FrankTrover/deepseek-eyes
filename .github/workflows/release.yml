# Pushing a v* tag: run tests, create a GitHub Release with dist assets,
# and publish to PyPI via trusted publishing (OIDC, no token stored).
# One-time PyPI setup: https://docs.pypi.org/trusted-publishers/
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install
        run: uv sync

      - name: Test
        run: uv run pytest

      - name: Build
        run: uv build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

      - name: Publish to PyPI
        # Trusted publishing via OIDC (no token stored). Requires the
        # one-time PyPI setup in step 1 below.
        uses: pypa/gh-action-pypi-publish@release/v1
