[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepseek-eyes"
version = "0.1.0"
description = "Windows-first local vision extension for coding agents (MiMo Token Plan backed)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7,<3",
    "openai>=1.40,<2",
    "httpx>=0.27,<1",
    "Pillow>=10.3,<12",
    "keyring>=25,<26",
    "platformdirs>=4.2,<5",
    "mcp>=2,<3",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
capture = ["mss>=9,<11", "pywin32>=306,<400"]
ui = ["PySide6>=6.7,<7"]

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5,<6",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
    "pip-audit>=2.7,<3",
]

[project.scripts]
deepseek-eyes = "deepseek_eyes.cli:app"
deepseek-eyes-mcp = "deepseek_eyes.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deepseek_eyes"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
# Windows asyncio pipe-transport teardown noise from the MCP SDK / subprocess
# bridges; harmless and not actionable from tests.
filterwarnings = [
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
